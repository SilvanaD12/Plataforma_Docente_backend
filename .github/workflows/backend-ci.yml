name: Backend CI

on:
  pull_request:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform5e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e ".[dev,postgres]"
      - name: Unit architecture and integration tests
        run: >-
          python -m pytest tests/unit tests/architecture tests/integration -q
          --cov=platform5e.domain --cov=platform5e.application --cov-fail-under=80
          --cov-report=term-missing --cov-report=xml:reports/coverage.xml
          --junitxml=reports/unit.xml
      - name: End-to-end tests over HTTP with SQLite
        run: python -m pytest tests/e2e -q --junitxml=reports/e2e-sqlite.xml
      - name: End-to-end over HTTP with PostgreSQL
        env:
          E2E_DATABASE_URL: postgresql+psycopg://platform:platform@localhost:5432/platform5e
        run: python -m pytest tests/e2e -q --junitxml=reports/e2e-postgres.xml
      - name: Upload pytest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: backend/reports
          retention-days: 14
