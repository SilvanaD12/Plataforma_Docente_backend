# Contrato de diseño de GEN-01. Las rutas y esquemas se implementan en FastAPI
# (routers/generation_requests.py, schemas/generation_requests.py) y se exportan a docs/api/openapi.json
# con scripts/export_openapi.py. Este archivo es la referencia para revisar esa exportación.
openapi: 3.1.0
info:
  title: Platform 5E API — Generation requests (GEN-01)
  version: 2.1.0-draft
  description: |
    Background generation of 5E resources, in individual or sequence mode, with a client idempotency key.
    Errors keep the common shape `{"error": {"code", "message"}}`: `code` is stable and in English, and `message`
    is shown to the teacher in Spanish.
servers:
  - url: /api/v1
security:
  - bearerAuth: []

paths:
  /generation-requests:
    post:
      tags: [generations]
      operationId: startGenerationRequest
      summary: Start a generation request
      description: |
        Validates the unit ownership, the outcome and that the unit has processed material, saves the request and
        runs it in the background. The client sends a stable `Idempotency-Key`. Repeating the same key with the
        same body returns the existing request (200), and using it with a different body returns 409.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartGenerationRequest' }
            examples:
              individual:
                value: { mode: individual, unitId: unidad-1, resourceTypes: [glosario], quantity: 2 }
              sequence:
                value: { mode: sequence, unitId: unidad-1, resourceTypes: [pregunta_detonante, item_opcion_multiple], quantity: 1 }
      responses:
        '202':
          description: Request accepted and queued.
          headers:
            Location: { schema: { type: string }, description: URL of the request status. }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationRequestStatus' }
        '200':
          description: Same key and same body. The request already exists and is returned in its current state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationRequestStatus' }
        '400': { $ref: '#/components/responses/BusinessRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/UnitNotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/InvalidParameters' }
        '429': { $ref: '#/components/responses/TooManyActive' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [generations]
      operationId: listGenerationRequests
      summary: List my generation requests of a unit
      description: Newest first. Used to recover a request after reloading when the client lost its id.
      parameters:
        - { name: unitId, in: query, required: true, schema: { type: string } }
        - { name: active, in: query, required: false, schema: { type: boolean, default: false },
            description: 'Only `queued` or `running` requests.' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Requests of the teacher in the unit.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/GenerationRequestSummary' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/UnitNotFound' }
        '422': { $ref: '#/components/responses/InvalidParameters' }

  /resource-types:
    get:
      tags: [catalog]
      operationId: listResourceTypes
      summary: List supported resource types in teaching order
      description: |
        Public catalog (no session). HU-024: each type lists the modalities it belongs to, so the client filters the
        type picker by the chosen modality. The default modality ("Textual") lives in the client selector, not here.
      responses:
        '200':
          description: Resource types in 5E order.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ResourceTypeInfo' } }

  /generation-requests/interpret:
    post:
      tags: [generations]
      operationId: interpretGenerationRequest
      summary: Interpret a generation request without creating it
      description: |
        GEN-C12 (HU-038). Uses deterministic rules on the authenticated teacher's current unit.
        Returns a partial draft even if interpretation issues remain. Does not save the message or draft,
        create a request, retrieve evidence, or call an AI provider. No idempotency header is required.
        Invalid request bodies return 422 INVALID_PARAMETERS. Unresolved or incompatible values in a valid
        message are interpretation issues in the 200 response.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InterpretGenerationRequest' }
      responses:
        '200':
          description: Editable draft and interpretation issues
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationInterpretation' }
              example:
                draft: { unitId: unidad-1, mode: individual, resourceTypes: [glosario], quantity: 2 }
                stages: [{ resourceType: glosario, stage: explain }]
                issues: []
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/UnitNotFound' }
        '422': { $ref: '#/components/responses/InvalidParameters' }

  /generation-requests/{request_id}:
    get:
      tags: [generations]
      operationId: getGenerationRequest
      summary: Get the status of a generation request
      description: |
        Returns the status of the request and of each step, in 5E order, as confirmed by the server. Requests of
        other teachers answer 404, the same as missing ones.
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Current status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationRequestStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/RequestNotFound' }
        '422': { $ref: '#/components/responses/InvalidParameters' }

  /generation-requests/{request_id}/evidence:
    get:
      tags: [generations]
      operationId: getGenerationEvidence
      summary: Get the evidence retrieved by a generation request
      description: |
        TA-010 (research R12). Every chunk the request retrieved from the material and gave to the model, in
        retrieval order, not only the ones its resources cite. The Ragas evaluation uses it as the retrieved context.
        A queued request answers 200 with no fragments. Requests of other teachers answer 404, the same as missing
        ones.
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Evidence retrieved by the request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationEvidence' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/RequestNotFound' }
        '422': { $ref: '#/components/responses/InvalidParameters' }

  # `POST /generations` (synchronous generation) was removed in T046. `GET /generations` and `GET /generations/{id}`
  # remain only to read the history saved before GEN-01; they are outside this contract.

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Stable client key, unique per teacher: 8 to 128 letters, digits, `-` or `_`. Reuse it when retrying the same
        request. The client always sends it; it is optional in the schema only so that a missing key answers
        400 IDEMPOTENCY_KEY_REQUIRED instead of a generic 422. With another format the API answers 422
        INVALID_PARAMETERS.
      schema: { type: [string, 'null'], pattern: '^[A-Za-z0-9_-]{8,128}$' }
      example: 3f6c2a1e-8b4d-4d7a-9a51-0c2f8e1b7d10

  schemas:
    Stage: { type: string, enum: [engage, explore, explain, elaborate, evaluate] }
    ResourceType:
      type: string
      description: Values of `domain/generation/resource_catalog.py` (same enum as `GET /resource-types`).
      enum: [pregunta_detonante, sondeo_diagnostico, audio_detonante, reto_prediccion, guia_exploracion,
             caso_indagacion, imagen_ilustrativa, diagrama_proceso, exploracion_guiada, explicacion, glosario,
             mapa_conceptual, infografia, podcast_resumen, ejercicio_aplicacion, caso_aplicado, emparejamiento,
             ordenar_pasos, item_opcion_multiple, verdadero_falso, completar_espacios, actividad_kinestesica]
    Modality:
      type: string
      description: |
        HU-024. A modality is a group of resource types (`MODALITY_TYPES` in `domain/generation/resource_formats.py`).
        A type can belong to more than one modality.
      enum: [Textual, Gamificado, Multimedia, Kinestésico]
    ResourceTypeInfo:
      type: object
      required: [id, name, singular, count, stage, group, format, hasOptions, modalities]
      properties:
        id: { $ref: '#/components/schemas/ResourceType' }
        name: { type: string }
        singular: { type: string }
        count: { type: array, items: { type: string }, minItems: 2, maxItems: 2, description: Singular and plural nouns. }
        stage: { $ref: '#/components/schemas/Stage' }
        group: { type: string }
        format: { type: string, enum: [text, visual, image, audio, interactive] }
        hasOptions: { type: boolean }
        modalities:
          type: array
          items: { $ref: '#/components/schemas/Modality' }
          minItems: 1
          description: Modalities that include this type. Every catalog type belongs to at least one.
    RequestStatus: { type: string, enum: [queued, running, succeeded, partially_succeeded, failed, interrupted] }
    StepStatus: { type: string, enum: [pending, running, succeeded, rejected, failed, interrupted] }

    StartGenerationRequest:
      type: object
      additionalProperties: false
      required: [mode, unitId, resourceTypes]
      properties:
        mode: { type: string, enum: [individual, sequence] }
        unitId: { type: string }
        resourceTypes:
          type: array
          items: { $ref: '#/components/schemas/ResourceType' }
          minItems: 1
          maxItems: 8
          description: '`individual` requires exactly one type. In `sequence`, repeated types are ignored and the steps follow the 5E order.'
        quantity: { type: integer, minimum: 1, maximum: 5, default: 1, description: Common quantity for every type. }
        outcomeId: { type: [string, 'null'], default: null }
        difficulty: { type: string, enum: [basica, intermedia, avanzada], default: intermedia }
        optionCount: { type: integer, minimum: 2, maximum: 5, default: 4 }
        topK: { type: integer, minimum: 1, maximum: 50, default: 10 }
        evidenceThreshold: { type: number, minimum: 0, maximum: 1, default: 0.6 }
        instructions: { type: string, maxLength: 500, default: '' }
        audience: { type: string, maxLength: 200, default: '' }
        competency: { type: string, maxLength: 200, default: '' }
        modalities:
          type: array
          items: { $ref: '#/components/schemas/Modality' }
          maxItems: 1
          description: |
            Optional. One modality per request (HU-024). When sent, every type in `resourceTypes` must belong to it
            (422 RESOURCE_TYPE_NOT_IN_MODALITY, nothing is created). When omitted, types are not filtered and the
            request is saved without a modality. There is no server default.

    InterpretGenerationRequest:
      type: object
      additionalProperties: false
      required: [unitId, message]
      properties:
        unitId: { type: string, minLength: 1, description: The unit open in the Generation tab. }
        message: { type: string, minLength: 1, maxLength: 2000, pattern: '\S', description: Trim before checking length. }

    GenerationInterpretation:
      type: object
      required: [draft, stages, issues]
      properties:
        draft: { $ref: '#/components/schemas/GenerationInterpretationDraft' }
        stages:
          type: array
          uniqueItems: true
          description: |
            One read-only catalog stage per draft resource type, in the same 5E order as draft.resourceTypes.
            Each resource type appears once. Distinct types can share a stage.
          items:
            type: object
            required: [resourceType, stage]
            properties:
              resourceType: { $ref: '#/components/schemas/ResourceType' }
              stage: { $ref: '#/components/schemas/Stage' }
        issues:
          type: array
          items: { $ref: '#/components/schemas/GenerationInterpretationIssue' }
        suggestedUnit:
          type: object
          description: Present only for an unambiguous mention of another unit owned by the teacher.
          required: [unitId, label]
          properties:
            unitId: { type: string }
            label: { type: string }

    GenerationInterpretationDraft:
      type: object
      additionalProperties: false
      required: [unitId, resourceTypes]
      description: |
        Uses the same keys as the creation request. Omitted optional fields make no changes to the form.
        Mode is derived from the number of resolved types and omitted when the list is empty.
      properties:
        unitId: { type: string, description: Always the current unit from the request. }
        mode: { type: string, enum: [individual, sequence] }
        resourceTypes:
          type: array
          maxItems: 8
          uniqueItems: true
          description: Distinct resource types in the generator's 5E order.
          items: { $ref: '#/components/schemas/ResourceType' }
        quantity: { type: integer, minimum: 1, maximum: 5 }
        modalities:
          type: array
          minItems: 1
          maxItems: 1
          items: { $ref: '#/components/schemas/Modality' }
        outcomeId:
          type: [string, 'null']
          description: |
            A valid ID selects the learning outcome. Null clears the selection when the teacher explicitly
            asks to remove it. Omission preserves the form value, including when a mention cannot be resolved.
        audience: { type: string, maxLength: 200 }
        competency: { type: string, maxLength: 200 }
        instructions: { type: string, maxLength: 500 }

    GenerationInterpretationIssue:
      type: object
      required: [field, kind, message, options]
      properties:
        field: { type: string, enum: [unitId, resourceTypes, quantity, modalities, outcomeId, audience, competency, instructions] }
        kind: { type: string, enum: [missing, ambiguous, not_allowed] }
        message: { type: string, description: Teacher-facing explanation in Spanish. }
        options:
          type: array
          description: Empty when there are no safe suggestions. Values correspond to the field being resolved.
          items:
            type: object
            required: [value, label]
            properties:
              value: { type: [string, integer] }
              label: { type: string }

    GenerationRequestSummary:
      type: object
      required: [id, mode, unitId, status, resourceTypes, createdAt]
      properties:
        id: { type: string, example: gen-req-6a1f… }
        mode: { type: string, enum: [individual, sequence, regeneration] }
        unitId: { type: string }
        status: { $ref: '#/components/schemas/RequestStatus' }
        resourceTypes: { type: array, items: { $ref: '#/components/schemas/ResourceType' } }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }

    GenerationRequestStatus:
      allOf:
        - $ref: '#/components/schemas/GenerationRequestSummary'
        - type: object
          required: [parameters, steps]
          properties:
            parameters: { $ref: '#/components/schemas/GenerationParametersView' }
            retrievalMode:
              type: [string, 'null']
              enum: [hybrid, bm25_fallback, null]
              description: Search fallback reported by Material. It is independent of `steps[].generator.fallback`.
            regeneration:
              description: Only in `regeneration` mode, started by Review through its regeneration port. Generation never discards the previous resource.
              oneOf: [{ $ref: '#/components/schemas/RegenerationTargetView' }, { type: 'null' }]
            failure: { oneOf: [{ $ref: '#/components/schemas/Problem' }, { type: 'null' }] }
            startedAt: { type: [string, 'null'], format: date-time }
            steps:
              type: array
              description: One step per resource type, in 5E order.
              items: { $ref: '#/components/schemas/GenerationStep' }

    GenerationStep:
      type: object
      required: [position, stage, resourceType, agent, status, resourceIds, rejections]
      properties:
        position: { type: integer, minimum: 0 }
        stage: { $ref: '#/components/schemas/Stage' }
        resourceType: { $ref: '#/components/schemas/ResourceType' }
        agent: { type: string, example: Agente de Enganchar }
        status: { $ref: '#/components/schemas/StepStatus' }
        resourceIds:
          type: array
          items: { type: string }
          description: Resources delivered to Review in this step. Read them with `GET /units/{unitId}/resources/{id}`.
        resources:
          type: array
          default: []
          description: Short view of the delivered resources for the progress screen.
          items: { $ref: '#/components/schemas/StepResource' }
        rejections:
          type: array
          items:
            type: object
            required: [title, reason, kind]
            properties:
              title: { type: string }
              reason: { type: string, description: In Spanish, shown to the teacher. }
              kind: { type: string, enum: [grounding, repetition, structure, distractor] }
        generator: { oneOf: [{ $ref: '#/components/schemas/StepGenerator' }, { type: 'null' }] }
        grounding: { oneOf: [{ $ref: '#/components/schemas/GroundingReport' }, { type: 'null' }] }
        distractorReliability: { oneOf: [{ $ref: '#/components/schemas/DistractorReliability' }, { type: 'null' }] }
        error: { oneOf: [{ $ref: '#/components/schemas/Problem' }, { type: 'null' }] }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }

    GenerationParametersView:
      type: object
      description: Saved parameters of the request. `mode` and `unitId` are at the top level.
      required: [resourceTypes, quantity, difficulty, optionCount, topK, evidenceThreshold, instructions, audience, competency, modalities]
      properties:
        resourceTypes: { type: array, items: { $ref: '#/components/schemas/ResourceType' }, description: Without duplicates and in 5E order. }
        quantity: { type: integer }
        outcomeId: { type: [string, 'null'], default: null }
        difficulty: { type: string, enum: [basica, intermedia, avanzada] }
        optionCount: { type: integer }
        topK: { type: integer }
        evidenceThreshold: { type: number }
        instructions: { type: string }
        audience: { type: string }
        competency: { type: string }
        modalities:
          type: array
          items: { $ref: '#/components/schemas/Modality' }
          maxItems: 1
          description: |
            The modality chosen by the teacher, as a list of 0 or 1 items (HU-024), with the same shape as the request
            body. Empty when the request did not send one. Requests saved before HU-024 return an empty list.

    RegenerationTargetView:
      type: object
      required: [resourceId, resourceVersion]
      properties:
        resourceId: { type: string }
        resourceVersion: { type: integer }

    StepResource:
      type: object
      description: Short view of a resource delivered to Review.
      required: [id, title, verificationStatus]
      properties:
        id: { type: string }
        title: { type: string }
        verificationStatus:
          type: string
          enum: [current, insufficient, pending]
          description: >-
            Current `verification.status` of the resource in Review (REV-01). Generation delivers `current` or
            `pending`; `insufficient` appears after an edit in Review. `pending` if the resource has no verification.

    StepGenerator:
      type: object
      required: [description, usesAi, fallback]
      properties:
        description: { type: string }
        usesAi: { type: boolean }
        fallback: { type: boolean, description: True when the rule-based generator drafted after the AI failed. }

    GroundingReport:
      type: object
      description: HU-016 grounding check. `hallucinationRate` is indicator I21. Same schema as in the generation history (`GET /generations/{id}`).
      required: [checkedClaims, supportedClaims, unsupportedClaims]
      properties:
        checkedClaims: { type: integer }
        supportedClaims: { type: integer }
        unsupportedClaims: { type: integer }
        hallucinationRate: { type: [number, 'null'] }
        unsupportedParagraphs: { type: integer, default: 0 }
        rejectedResources: { type: array, default: [], items: { $ref: '#/components/schemas/RejectedResource' } }

    RejectedResource:
      type: object
      required: [title, reason]
      properties:
        title: { type: string }
        reason: { type: string, description: In Spanish. }

    DistractorReliability:
      type: object
      description: HU-019 distractor reliability check (indicator I5). Same schema as in the generation history (`GET /generations/{id}`).
      required: [evaluatedDistractors, discardedAsCorrect]
      properties:
        evaluatedDistractors: { type: integer }
        discardedAsCorrect: { type: integer }
        reliabilityErrorRate: { type: [number, 'null'] }

    RetrievedFragment:
      type: object
      description: A chunk retrieved by the request, with its origin. Same fields as the stored evidence, without
        `retrievedAt`, which is at the top level.
      required: [chunkId, documentId, documentName, location, text, relevance]
      properties:
        chunkId: { type: string }
        documentId: { type: string }
        documentName: { type: string }
        location: { type: string }
        text: { type: string }
        relevance: { type: number, minimum: 0, maximum: 1, description: Relevance reported by Material. }
        sourceUrl: { type: [string, 'null'] }
        license: { type: [string, 'null'] }

    GenerationEvidence:
      type: object
      required: [requestId, retrievalMode, limit, retrievedAt, fragments]
      properties:
        requestId: { type: string }
        retrievalMode:
          type: [string, 'null']
          enum: [hybrid, bm25_fallback, null]
          description: Search fallback reported by Material. `null` while the request is queued.
        limit:
          type: integer
          minimum: 1
          description: Maximum number of chunks the request retrieved, its `topK` bounded from 3 to 12.
        retrievedAt:
          type: [string, 'null']
          format: date-time
          description: When the request retrieved the chunks. `null` while the request is queued.
        fragments:
          type: array
          items: { $ref: '#/components/schemas/RetrievedFragment' }
          description: |
            Every retrieved chunk, in retrieval order. The resources cite a subset of them. Empty while the request is
            queued or if the retrieval failed.

    Problem:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: DEADLINE_EXCEEDED }
        message: { type: string }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: [array, 'null'], items: { type: object } }

  responses:
    BusinessRule:
      description: |
        Business rule. Codes: `NO_PROCESSED_MATERIAL` (the unit has no processed material), `INVALID_OUTCOME`,
        `INVALID_SEQUENCE` (`individual` with more than one type), `IDEMPOTENCY_KEY_REQUIRED`.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unauthorized:
      description: Missing, invalid or expired session token (`UNAUTHORIZED`).
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    UnitNotFound:
      description: '`UNIT_NOT_FOUND`: the unit does not exist or belongs to another teacher. Both answers are identical.'
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    RequestNotFound:
      description: '`GENERATION_REQUEST_NOT_FOUND`: missing or belongs to another teacher.'
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    IdempotencyConflict:
      description: '`IDEMPOTENCY_KEY_REUSED`: the key was already used by this teacher with a different body.'
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    InvalidParameters:
      description: |
        `INVALID_PARAMETERS`: type, range or unknown field; `details` lists each problem.
        `RESOURCE_TYPE_NOT_IN_MODALITY`: a requested type does not belong to the chosen modality (HU-024). The request
        is not created.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    TooManyActive:
      description: '`TOO_MANY_ACTIVE_REQUESTS`: the teacher already has 2 requests in `queued` or `running`.'
      headers:
        Retry-After: { schema: { type: integer }, description: Suggested seconds before retrying. }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unavailable:
      description: '`PERSISTENCE_UNAVAILABLE` or `EVIDENCE_UNAVAILABLE` (Material did not answer).'
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
